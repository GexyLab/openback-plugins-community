PLG_API-AUTHENTICATION_OPENBACKAPPAUTH="Autenticazione API - OpenBack App Auth"
PLG_API-AUTHENTICATION_OPENBACKAPPAUTH_XML_DESCRIPTION="L'API Web Services di Joomla accetta gli access token del pool di utenti OpenBack (Authorization: Bearer) ed esegue la richiesta come l'utente Joomla collegato. Disattivato finché non lo attivi. L'utente deve avere anche il permesso Accesso ai Web Services."
PLG_API-AUTHENTICATION_OPENBACKAPPAUTH_CLIENT_IDS_LABEL="Altri client ID accettati"
PLG_API-AUTHENTICATION_OPENBACKAPPAUTH_CLIENT_IDS_DESC="Client ID di altre app dello stesso pool i cui token sono accettati (per esempio la tua app mobile), separati da virgole. L'app web del plugin di sistema è sempre accettata."
