PLG_API-AUTHENTICATION_OPENBACKAPPAUTH="API Authentication - OpenBack App Auth"
PLG_API-AUTHENTICATION_OPENBACKAPPAUTH_XML_DESCRIPTION="The Joomla Web Services API accepts the access tokens of the OpenBack user pool (Authorization: Bearer) and runs the request as the linked Joomla user. Off until you enable it. The user also needs the Web Services Login permission."
PLG_API-AUTHENTICATION_OPENBACKAPPAUTH_CLIENT_IDS_LABEL="Other accepted client IDs"
PLG_API-AUTHENTICATION_OPENBACKAPPAUTH_CLIENT_IDS_DESC="Client IDs of other apps of the same pool whose tokens are accepted too (e.g. your mobile app), separated by commas. The web app of the system plugin is always accepted."
