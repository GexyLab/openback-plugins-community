PLG_SYSTEM_OPENBACKAPPAUTH="System - OpenBack App Auth"
PLG_SYSTEM_OPENBACKAPPAUTH_XML_DESCRIPTION="Sign in to Joomla with an OpenBack user pool (App authenticator): OpenID Connect with PKCE, account linking, group mapping and single logout. Holds the settings of the OpenBack App Auth package."
PLG_SYSTEM_OPENBACKAPPAUTH_REDIRECT_URI_LABEL="Redirect URI to register"
PLG_SYSTEM_OPENBACKAPPAUTH_REDIRECT_URI_DESC="In the OpenBack portal, open the user pool, tab Apps, add an app of kind web and register exactly this address as redirect URI."
PLG_SYSTEM_OPENBACKAPPAUTH_ISSUER_LABEL="Pool address (issuer)"
PLG_SYSTEM_OPENBACKAPPAUTH_ISSUER_DESC="The user pool's address, shown in the OpenBack portal. https only (http only for localhost)."
PLG_SYSTEM_OPENBACKAPPAUTH_CLIENT_ID_LABEL="Client ID"
PLG_SYSTEM_OPENBACKAPPAUTH_CLIENT_SECRET_LABEL="Client secret"
PLG_SYSTEM_OPENBACKAPPAUTH_CLIENT_SECRET_DESC="The secret of the web app, shown once by the OpenBack portal. Only users who can manage plugins can see these settings."
PLG_SYSTEM_OPENBACKAPPAUTH_SCOPES_LABEL="Scopes"
PLG_SYSTEM_OPENBACKAPPAUTH_PROVIDER_LABEL="Provider (optional)"
PLG_SYSTEM_OPENBACKAPPAUTH_PROVIDER_DESC="A provider id of the pool (uprov_...) to go straight to it (e.g. Google) instead of the pool's sign-in page."
PLG_SYSTEM_OPENBACKAPPAUTH_BUTTON_LABEL_LABEL="Button label"
PLG_SYSTEM_OPENBACKAPPAUTH_BUTTON_LABEL_DESC="Default label of the module's sign-in button. Empty: Sign in with OpenBack."
PLG_SYSTEM_OPENBACKAPPAUTH_FIELDSET_ACCOUNTS="Accounts"
PLG_SYSTEM_OPENBACKAPPAUTH_AUTO_CREATE_LABEL="Create a Joomla account for new users"
PLG_SYSTEM_OPENBACKAPPAUTH_REQUIRE_VERIFIED_LABEL="Create accounts only for verified email addresses"
PLG_SYSTEM_OPENBACKAPPAUTH_LINK_BY_EMAIL_LABEL="Link existing accounts by verified email"
PLG_SYSTEM_OPENBACKAPPAUTH_LINK_BY_EMAIL_DESC="Off by default. Trust the pool's email verification before turning it on. Super Users are never linked this way: they link their account from the module while signed in."
PLG_SYSTEM_OPENBACKAPPAUTH_GROUP_MAP_LABEL="Group mapping"
PLG_SYSTEM_OPENBACKAPPAUTH_GROUP_MAP_DESC="OpenBack role to Joomla group. A user gets the groups of every rule whose role they have (roles of the active organization); with none, the default group."
PLG_SYSTEM_OPENBACKAPPAUTH_GROUP_MAP_ROLE="OpenBack role"
PLG_SYSTEM_OPENBACKAPPAUTH_GROUP_MAP_GROUP="Joomla group"
PLG_SYSTEM_OPENBACKAPPAUTH_DEFAULT_GROUP_LABEL="Default group"
PLG_SYSTEM_OPENBACKAPPAUTH_DEFAULT_GROUP_DESC="The group of new users when no rule matches."
PLG_SYSTEM_OPENBACKAPPAUTH_DEFAULT_GROUP_SITE="- The new user group of Users: Options -"
PLG_SYSTEM_OPENBACKAPPAUTH_SYNC_GROUPS_LABEL="Update the groups at every sign-in"
PLG_SYSTEM_OPENBACKAPPAUTH_SYNC_GROUPS_DESC="Groups named in the mapping follow the user's OpenBack roles; other groups are kept. Never applied to Super Users."
PLG_SYSTEM_OPENBACKAPPAUTH_FIELDSET_LOGOUT="Sign-out"
PLG_SYSTEM_OPENBACKAPPAUTH_SINGLE_LOGOUT_LABEL="Single logout"
PLG_SYSTEM_OPENBACKAPPAUTH_SINGLE_LOGOUT_DESC="Signing out of Joomla also ends the pool's session."
PLG_SYSTEM_OPENBACKAPPAUTH_POST_LOGOUT_LABEL="Post-logout redirect URI"
PLG_SYSTEM_OPENBACKAPPAUTH_POST_LOGOUT_DESC="Where the pool sends the browser after signing out; register it on the app. Empty: the site's root (below)."
PLG_SYSTEM_OPENBACKAPPAUTH_POST_LOGOUT_DEFAULT_LABEL="Default post-logout redirect URI"
