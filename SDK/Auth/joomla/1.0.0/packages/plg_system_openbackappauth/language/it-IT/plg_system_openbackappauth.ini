PLG_SYSTEM_OPENBACKAPPAUTH="Sistema - OpenBack App Auth"
PLG_SYSTEM_OPENBACKAPPAUTH_XML_DESCRIPTION="Accesso a Joomla con un pool di utenti OpenBack (App authenticator): OpenID Connect con PKCE, collegamento degli account, mappatura dei gruppi e uscita unica. Contiene le impostazioni del pacchetto OpenBack App Auth."
PLG_SYSTEM_OPENBACKAPPAUTH_REDIRECT_URI_LABEL="Redirect URI da registrare"
PLG_SYSTEM_OPENBACKAPPAUTH_REDIRECT_URI_DESC="Nel portale OpenBack apri il pool di utenti, scheda App, aggiungi un'app di tipo web e registra esattamente questo indirizzo come redirect URI."
PLG_SYSTEM_OPENBACKAPPAUTH_ISSUER_LABEL="Indirizzo del pool (issuer)"
PLG_SYSTEM_OPENBACKAPPAUTH_ISSUER_DESC="L'indirizzo del pool di utenti, mostrato nel portale OpenBack. Solo https (http solo per localhost)."
PLG_SYSTEM_OPENBACKAPPAUTH_CLIENT_ID_LABEL="Client ID"
PLG_SYSTEM_OPENBACKAPPAUTH_CLIENT_SECRET_LABEL="Client secret"
PLG_SYSTEM_OPENBACKAPPAUTH_CLIENT_SECRET_DESC="Il segreto dell'app web, mostrato una sola volta dal portale OpenBack. Queste impostazioni sono visibili solo a chi può gestire i plugin."
PLG_SYSTEM_OPENBACKAPPAUTH_SCOPES_LABEL="Scope"
PLG_SYSTEM_OPENBACKAPPAUTH_PROVIDER_LABEL="Provider (facoltativo)"
PLG_SYSTEM_OPENBACKAPPAUTH_PROVIDER_DESC="L'id di un provider del pool (uprov_...) per andare direttamente a quello (per esempio Google) invece della pagina di accesso del pool."
PLG_SYSTEM_OPENBACKAPPAUTH_BUTTON_LABEL_LABEL="Testo del pulsante"
PLG_SYSTEM_OPENBACKAPPAUTH_BUTTON_LABEL_DESC="Testo predefinito del pulsante di accesso del modulo. Vuoto: Accedi con OpenBack."
PLG_SYSTEM_OPENBACKAPPAUTH_FIELDSET_ACCOUNTS="Account"
PLG_SYSTEM_OPENBACKAPPAUTH_AUTO_CREATE_LABEL="Crea un account Joomla per i nuovi utenti"
PLG_SYSTEM_OPENBACKAPPAUTH_REQUIRE_VERIFIED_LABEL="Crea account solo per indirizzi email verificati"
PLG_SYSTEM_OPENBACKAPPAUTH_LINK_BY_EMAIL_LABEL="Collega gli account esistenti tramite email verificata"
PLG_SYSTEM_OPENBACKAPPAUTH_LINK_BY_EMAIL_DESC="Disattivato per impostazione predefinita. Attivalo solo se ti fidi della verifica delle email del pool. I Super Utenti non vengono mai collegati così: collegano il proprio account dal modulo dopo l'accesso."
PLG_SYSTEM_OPENBACKAPPAUTH_GROUP_MAP_LABEL="Mappatura dei gruppi"
PLG_SYSTEM_OPENBACKAPPAUTH_GROUP_MAP_DESC="Ruolo OpenBack verso gruppo Joomla. Un utente riceve i gruppi di ogni regola di cui ha il ruolo (ruoli dell'organizzazione attiva); se nessuna regola corrisponde, il gruppo predefinito."
PLG_SYSTEM_OPENBACKAPPAUTH_GROUP_MAP_ROLE="Ruolo OpenBack"
PLG_SYSTEM_OPENBACKAPPAUTH_GROUP_MAP_GROUP="Gruppo Joomla"
PLG_SYSTEM_OPENBACKAPPAUTH_DEFAULT_GROUP_LABEL="Gruppo predefinito"
PLG_SYSTEM_OPENBACKAPPAUTH_DEFAULT_GROUP_DESC="Il gruppo dei nuovi utenti quando nessuna regola corrisponde."
PLG_SYSTEM_OPENBACKAPPAUTH_DEFAULT_GROUP_SITE="- Il gruppo dei nuovi utenti di Utenti: Opzioni -"
PLG_SYSTEM_OPENBACKAPPAUTH_SYNC_GROUPS_LABEL="Aggiorna i gruppi a ogni accesso"
PLG_SYSTEM_OPENBACKAPPAUTH_SYNC_GROUPS_DESC="I gruppi nominati nella mappatura seguono i ruoli OpenBack dell'utente; gli altri gruppi restano. Mai applicato ai Super Utenti."
PLG_SYSTEM_OPENBACKAPPAUTH_FIELDSET_LOGOUT="Uscita"
PLG_SYSTEM_OPENBACKAPPAUTH_SINGLE_LOGOUT_LABEL="Uscita unica"
PLG_SYSTEM_OPENBACKAPPAUTH_SINGLE_LOGOUT_DESC="Uscire da Joomla chiude anche la sessione del pool."
PLG_SYSTEM_OPENBACKAPPAUTH_POST_LOGOUT_LABEL="Redirect URI dopo l'uscita"
PLG_SYSTEM_OPENBACKAPPAUTH_POST_LOGOUT_DESC="Dove il pool rimanda il browser dopo l'uscita; registralo sull'app. Vuoto: la radice del sito (qui sotto)."
PLG_SYSTEM_OPENBACKAPPAUTH_POST_LOGOUT_DEFAULT_LABEL="Redirect URI predefinito dopo l'uscita"
